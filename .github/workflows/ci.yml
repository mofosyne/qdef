name: CI

on:
  push:
  pull_request:

jobs:
  node-prototype:
    name: Node prototype (round-trip tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - name: smoke-test gen-type-id and validate-type-id scripts
        run: |
          # gen-type-id: known test vector (4-byte derivation)
          output=$(node scripts/gen-type-id.js com.example.tagdrop/route)
          echo "$output"
          echo "$output" | grep -q "h'34e1e4af'" || { echo "::error::gen-type-id 4-byte output mismatch"; exit 1; }

          # gen-type-id: known test vector (8-byte derivation)
          output=$(node scripts/gen-type-id.js --width 8 com.example.tagdrop/route)
          echo "$output"
          echo "$output" | grep -q "h'34e1e4af986c74e2'" || { echo "::error::gen-type-id 8-byte output mismatch"; exit 1; }

          # gen-type-id: namespace mode
          output=$(node scripts/gen-type-id.js --namespace com.example/tagdrop-paper)
          echo "$output"
          echo "$output" | grep -q "h'21bb10277228cfe2'" || { echo "::error::gen-type-id namespace output mismatch"; exit 1; }

          # validate-type-id: correct ID passes (hex byte string)
          node scripts/validate-type-id.js com.example.tagdrop/route 34E1E4AF986C74E2

          # validate-type-id: wrong ID fails
          if node scripts/validate-type-id.js com.example.tagdrop/route AABBCCDD; then
            echo "::error::validate-type-id should have failed for wrong ID"
            exit 1
          fi

          # validate-type-id: namespace mode
          node scripts/validate-type-id.js --namespace com.example/tagdrop-paper 21BB10277228CFE2

          # validate-type-id: --reverse mode
          node scripts/validate-type-id.js --reverse 34E1E4AF986C74E2 com.example.tagdrop/route

          # validate-type-id: collision-prone name warning (still passes derivation, but warns)
          node scripts/validate-type-id.js com.example.myapp/config 88CAA02B

          echo "All gen-type-id / validate-type-id checks passed."

  rust-core:
    name: Rust core (tests, clippy, fmt, no_std embedded build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/qdef-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/qdef-core
      - name: cargo test (host)
        run: cargo test --locked
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: build for bare-metal Cortex-M0 (no_std, no heap — the actual point of this crate)
        run: cargo build --release --locked --target thumbv6m-none-eabi

  rust-fixtures-in-sync:
    name: Rust test fixtures match the Node encoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
        working-directory: prototype
      - name: regenerate rust/qdef-core/src/fixtures.rs
        run: node scripts/gen-rust-fixtures.js > ../rust/qdef-core/src/fixtures.rs
        working-directory: prototype
      - name: fail if fixtures.rs no longer matches the Node encoder's output
        run: |
          if ! git diff --exit-code -- rust/qdef-core/src/fixtures.rs; then
            echo "::error::rust/qdef-core/src/fixtures.rs is out of sync with 'node prototype/scripts/gen-rust-fixtures.js'. Regenerate and commit it."
            exit 1
          fi
